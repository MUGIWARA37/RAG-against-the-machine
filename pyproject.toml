[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "hloureda@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain-text-splitters>=1.1.2",
    "pydantic>=2.13.5",
    "rank-bm25>=0.2.2",
    "tqdm>=4.70.1",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.29.0",
    "fire>=0.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
]
