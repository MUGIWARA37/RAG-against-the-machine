[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "hloureda@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fire>=0.7.1",
    "langchain-text-splitters>=1.1.2",
    "pydantic>=2.13.5",
    "rank-bm25>=0.2.2",
    "tqdm>=4.70.1",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
]
